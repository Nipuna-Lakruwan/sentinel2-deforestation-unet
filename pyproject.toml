[project]
name = "deforestation"
version = "0.1.0"
description = "Forest mapping with a U-Net on Sentinel-2, and change detection of newly cleared areas"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.5",
    "numpy>=2.0",
    "rasterio>=1.4",
    "pystac-client>=0.8",
    "folium>=0.18",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "pillow>=10",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
